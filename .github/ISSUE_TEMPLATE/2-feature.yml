name: 功能建議 / Feature request
description: 希望新增或改進的功能、設定的預設值 / A new feature, an improvement or a better default
labels: ["建議"]
body:
  - type: textarea
    id: what
    attributes:
      label: 想做什麼 / What do you want to do?
    validations:
      required: true
  - type: textarea
    id: now
    attributes:
      label: 現在怎麼做、哪裡不方便 / How do you do it now?
  - type: input
    id: camera
    attributes:
      label: 相機型號 / Camera model
