name: 翻譯錯誤 / Translation
description: 文字翻錯或不通順 / Wrong or awkward text
labels: ["翻譯"]
body:
  - type: input
    id: language
    attributes:
      label: 語言 / Language
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: 畫面位置 / Where in the app
      placeholder: "設定 → 拍攝 / Settings → Shooting"
    validations:
      required: true
  - type: input
    id: current
    attributes:
      label: 目前文字 / Current text
    validations:
      required: true
  - type: input
    id: suggested
    attributes:
      label: 建議文字 / Suggested text
    validations:
      required: true
