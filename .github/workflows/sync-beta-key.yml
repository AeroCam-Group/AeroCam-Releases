name: Sync Beta key
# Copies the test key from beta-key.txt into the translated READMEs (readme/README.*.md), so every
# language shows it with GitHub's copy button. README.md (Traditional Chinese) is written by the key tool.
# Runs when beta-key.txt or a translated README changes, and on a schedule in case the key tool's push
# doesn't start workflows (every 6 hours on Mondays, when the key changes, and once a day otherwise).

on:
  push:
    branches: [main]
    paths: [beta-key.txt, "readme/**", scripts/sync_beta_key.py, .github/workflows/sync-beta-key.yml]
  schedule:
    - cron: "41 */6 * * 1"
    - cron: "41 1 * * *"
  workflow_dispatch:

concurrency:
  group: sync-beta-key
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Write the key into the translated READMEs
        run: python3 scripts/sync_beta_key.py
      - name: Commit if anything changed
        run: |
          if git diff --quiet; then echo "Already up to date"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Translated READMEs: current Beta test key"
          git push
